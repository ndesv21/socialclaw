name: Publish to MCP Registry

on:
  push:
    tags: ["v*"] # Triggers on version tags like v0.1.19

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Sync version from tag into server.json
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp.json
          mv server.tmp.json server.json

      - name: Wait for npm version to be available
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          for i in $(seq 1 30); do
            if curl -sf "https://registry.npmjs.org/socialclaw/$VERSION" > /dev/null; then
              echo "npm has $VERSION"
              exit 0
            fi
            echo "waiting for npm $VERSION ($i/30)"
            sleep 10
          done
          echo "npm never published $VERSION"
          exit 1

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
